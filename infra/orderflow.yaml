# What: the whole AWS environment for the OrderFlow proof of concept, as code (CloudFormation).
# Who calls it: `aws cloudformation deploy` (see docs/AWS_DEPLOY.md) and the deploy job in .github/workflows/ci.yml.
# To extend: add a resource here, give the app's role (InstanceRole) only the permissions it needs, and add an output if the app must know about it.
#
# What it builds (docs/ARCHITECTURE.md explains why):
#   - a VPC with two public subnets (the app server) and two private subnets (the database, no internet access)
#   - EC2: one Amazon Linux 2023 server running the Next.js app (set up by infra/ec2/setup.sh from the Git repository)
#   - Amazon RDS for MySQL 8.4: the app's database, encrypted, TLS required, password kept in Secrets Manager
#   - Amazon S3: a private, encrypted, versioned bucket for the PDFs (POs, proofs of payment, shipping documents)
#   - Amazon SES: the sender identity for approval links (story 3) and payment and warehouse messages (story 4)
#   - Amazon EventBridge Scheduler: runs the due jobs (SPR reminders, hand-overs, alerts) every few minutes
#   - AWS Secrets Manager, an AWS Budgets cost alert, and a CloudWatch alarm that recovers the server if its host fails
AWSTemplateFormatVersion: "2010-09-09"
Description: Spectra OrderFlow proof of concept (SCCCI x NYP 26S2, PS11). Synthetic data only.

Parameters:
  AllowedCidr:
    Type: String
    Description: Who may open the app (HTTP, port 80), for example your own IP followed by /32. The app has no real login, so keep this narrow.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: An IPv4 CIDR such as 203.0.113.25/32.
  SenderEmail:
    Type: String
    Description: The address OrderFlow sends email from. SES emails it a verification link; click it before testing.
  DemoInbox:
    Type: String
    Description: Every email goes to this one inbox (the staff and customer addresses in the sample data are made up). Also receives the budget alerts. Must be verified in SES while the account is in the SES sandbox.
  RepoUrl:
    Type: String
    Default: https://github.com/AlvinChang94/ECP-26S2.git
    Description: Git repository the server clones. It must be readable without a password (public), or the setup fails.
  RepoBranch:
    Type: String
    Default: main
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium]
    Description: t3.small (2 GB) is enough for the demo; building the app needs at least 2 GB.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small]
  DbMultiAz:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: '"true" keeps a standby database in a second Availability Zone (about double the database cost). Off for the demo.'
  DbBackupRetentionDays:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 35
    Description: Days of automated database backups. 1 suits the AWS free plan (it refuses longer retention); 7 or more on a paid plan.
  JobsRate:
    Type: String
    Default: rate(5 minutes)
    Description: How often EventBridge Scheduler runs the due jobs.
  MonthlyBudgetUsd:
    Type: Number
    Default: 30
    Description: Monthly cost budget. An email goes to DemoInbox at 80% of actual spend and when the forecast passes 100%.
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 image (looked up automatically).

Conditions:
  InboxDiffersFromSender: !Not [!Equals [!Ref SenderEmail, !Ref DemoInbox]]
  UseMultiAz: !Equals [!Ref DbMultiAz, "true"]

Resources:
  # ------------------------------------------------------------------ network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-a" }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-b" }]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-a" }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-b" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # Private subnets have no route to the internet: the database is reachable only from inside the VPC.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PrivateSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: OrderFlow app server. HTTP (port 80) from AllowedCidr only; no SSH (use Session Manager).
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # Port 80, not 3000: many school and office networks block outgoing connections to port 3000.
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedCidr, Description: OrderFlow web app }
      SecurityGroupEgress:
        - { IpProtocol: -1, CidrIp: 0.0.0.0/0, Description: "Updates, Git and AWS APIs" }

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: OrderFlow database. MySQL from the app server only.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3306, ToPort: 3306, SourceSecurityGroupId: !Ref AppSecurityGroup, Description: MySQL from the app server }

  # ------------------------------------------------------------------ database (Amazon RDS for MySQL)
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the OrderFlow database
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: OrderFlow MySQL settings (connections must use TLS)
      Family: mysql8.4
      Parameters:
        require_secure_transport: "1"

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: mysql
      EngineVersion: "8.4"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp2 # the storage type the free tier covers
      StorageEncrypted: true
      DBName: orderflow
      MasterUsername: orderflow_admin
      # RDS creates the password and keeps it in Secrets Manager; it never appears in this template or in Git.
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      DBParameterGroupName: !Ref DbParameterGroup
      PubliclyAccessible: false
      MultiAZ: !If [UseMultiAz, true, false]
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      DeletionProtection: false

  # ------------------------------------------------------------------ documents (Amazon S3)
  DocumentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }

  DocumentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RefuseUnencryptedConnections
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt DocumentBucket.Arn, !Sub "${DocumentBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # ------------------------------------------------------------------ email (Amazon SES)
  # Creating an identity makes SES send a verification email to that address. Nothing is sent from it until it is clicked.
  SenderIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref SenderEmail

  DemoInboxIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: InboxDiffersFromSender
    Properties:
      EmailIdentity: !Ref DemoInbox

  # ------------------------------------------------------------------ secrets
  JobsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Shared secret the scheduled job run sends to /api/jobs/run
      GenerateSecretString: { PasswordLength: 48, ExcludePunctuation: true }

  ApprovalLinkSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Signs the SPR approval links (story 3)
      GenerateSecretString: { PasswordLength: 48, ExcludePunctuation: true }

  # ------------------------------------------------------------------ app server (EC2)
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Session Manager (shell access without SSH) and Run Command (used by the scheduler and the deploy job).
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: orderflow-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DocumentsReadWrite
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${DocumentBucket.Arn}/*"
              - Sid: DocumentsList
                # Lets a lookup of a missing file return "not found" instead of "access denied".
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocumentBucket.Arn
              - Sid: SendEmail
                Effect: Allow
                Action: [ses:SendEmail]
                Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
              - Sid: ReadOwnSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref JobsSecret
                  - !Ref ApprovalLinkSecret
                  - !GetAtt Database.MasterUserSecret.SecretArn
              - Sid: ReportSetupResult
                Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Ref AWS::StackId

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        # IMDSv2 only: the server's credentials cannot be read through a simple request forgery.
        MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled }
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }

  # A fixed public address, so the app URL (and the approval links already emailed) survive a stop and start.
  AppElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc

  AppInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      # The stack waits until infra/ec2/setup.sh reports that the app is running (installing, seeding and building take a while).
      ResourceSignal: { Count: 1, Timeout: PT45M }
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds: [!Ref AppSecurityGroup]
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-app" }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Runs once on first boot. The real work is in infra/ec2/setup.sh in the repository, so it is reviewed and versioned like code.
          exec >> /var/log/orderflow-setup.log 2>&1
          report() { /opt/aws/bin/cfn-signal -e "$1" --stack "${AWS::StackName}" --resource AppInstance --region "${AWS::Region}" || true; }
          dnf install -y git aws-cfn-bootstrap || { report 1; exit 1; }
          mkdir -p /etc/orderflow
          cat > /etc/orderflow/stack.env <<'STACK'
          AWS_REGION=${AWS::Region}
          S3_BUCKET=${DocumentBucket}
          SES_FROM_ADDRESS=${SenderEmail}
          SES_TEST_RECIPIENT=${DemoInbox}
          DB_HOST=${Database.Endpoint.Address}
          DB_SECRET_ARN=${Database.MasterUserSecret.SecretArn}
          JOBS_SECRET_ARN=${JobsSecret}
          APPROVAL_SECRET_ARN=${ApprovalLinkSecret}
          APP_BASE_URL=http://${AppElasticIp}
          APP_PORT=80
          REPO_URL=${RepoUrl}
          REPO_BRANCH=${RepoBranch}
          STACK
          sed -i 's/^ *//' /etc/orderflow/stack.env
          git clone --branch "${RepoBranch}" "${RepoUrl}" /opt/orderflow/app || { report 1; exit 1; }
          bash /opt/orderflow/app/infra/ec2/setup.sh
          report $?

  AppElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt AppElasticIp.AllocationId
      InstanceId: !Ref AppInstance

  # If the hardware under the server fails, EC2 moves it to healthy hardware (same address, same disk).
  AppRecoveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Recover the OrderFlow server when its host fails the system status check
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{ Name: InstanceId, Value: !Ref AppInstance }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Sub "arn:${AWS::Partition}:automate:${AWS::Region}:ec2:recover"]

  # ------------------------------------------------------------------ due jobs (Amazon EventBridge Scheduler)
  # Every few minutes the scheduler asks Systems Manager to run one command on the server, which calls the app's
  # /api/jobs/run on localhost with the shared secret. Nothing about the jobs endpoint is exposed to the internet.
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId } }
      Policies:
        - PolicyName: run-due-jobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${AppInstance}"

  JobsSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Runs OrderFlow's due jobs (SPR reminders and hand-overs, payment and document reminders, alerts)
      ScheduleExpression: !Ref JobsRate
      FlexibleTimeWindow: { Mode: "OFF" }
      State: ENABLED
      Target:
        Arn: !Sub "arn:${AWS::Partition}:scheduler:::aws-sdk:ssm:sendCommand"
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy: { MaximumRetryAttempts: 0 }
        Input: !Sub '{"DocumentName":"AWS-RunShellScript","InstanceIds":["${AppInstance}"],"Comment":"OrderFlow due jobs","TimeoutSeconds":60,"Parameters":{"commands":["/usr/local/bin/orderflow-run-jobs"]}}'

  # ------------------------------------------------------------------ cost control (AWS Budgets)
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref DemoInbox }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref DemoInbox }]

Outputs:
  AppUrl:
    Description: Open this in a browser from an address inside AllowedCidr.
    Value: !Sub "http://${AppElasticIp}"
  InstanceId:
    Description: For Session Manager (aws ssm start-session --target <id>) and the deploy job.
    Value: !Ref AppInstance
  DocumentBucketName:
    Value: !Ref DocumentBucket
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  SesNote:
    Description: Reminder
    Value: !Sub "Click the SES verification emails sent to ${SenderEmail} and ${DemoInbox}, or no email can be sent."
